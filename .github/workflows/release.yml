name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release from plugin version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -E '^\s+\* Version:' cem-mobile-app.php | head -1 | awk '{print $3}' | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "Could not read plugin version from cem-mobile-app.php"
            exit 1
          fi
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 0
          fi
          gh release create "$TAG" --title "CEM Mobile App ${VERSION}" --generate-notes --target "${GITHUB_SHA}"
